version: '3.8'

services:
  postgres:
    image: postgres:14
    environment:
      POSTGRES_USER: voodoo
      POSTGRES_PASSWORD: wizardmagic123
      POSTGRES_DB: voodoo_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:latest
    environment:
      MEILI_MASTER_KEY: wizGj762Kja98UxzPqLm53sBn45DfR
      MEILI_NO_ANALYTICS: 'true'
      MEILI_ENV: production
    ports:
      - '7700:7700'
    volumes:
      - meili_data:/meili_data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    restart: unless-stopped

volumes:
  postgres_data:
  meili_data:
